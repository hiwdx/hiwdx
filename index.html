        <button class="home-sheet-close" type="button" aria-label="关闭" data-wechat-close>×</button>

        </a>
        <div class="home-sheet-copy">
          <h2 id="wechat-title">Andrew 公众号</h2>
          <p>微信扫码关注，或者直接阅读文章合集。</p>
          <a class="home-sheet-link" href="https://mp.weixin.qq.com/mp/appmsgalbum?__biz=MzAxMDMzMzM4NQ==&amp;action=getalbum&amp;album_id=1345414793699835904#wechat_redirect" target="_blank" rel="noopener">阅读文章合集 ↗</a>
        </div>
      </div>
    </dialog>

    <script>
    fetch('/footer.html')
      .then(response => response.text())
      .then(data => document.body.insertAdjacentHTML('beforeend', data));

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const wechatArticlesURL = 'https://mp.weixin.qq.com/mp/appmsgalbum?__biz=MzAxMDMzMzM4NQ==&action=getalbum&album_id=1345414793699835904#wechat_redirect';

    function wireSheet(dialogSelector, openSelector, closeSelector, iosURL) {
      const dialog = document.querySelector(dialogSelector);
      const openButtons = document.querySelectorAll(openSelector);
      const closeButton = document.querySelector(closeSelector);

      function closeSheet() {
        if (typeof dialog.close === 'function') {
          dialog.close();
        } else {
          dialog.removeAttribute('open');
        }
      }

      openButtons.forEach(openButton => {
        openButton.addEventListener('click', () => {
          if (isIOS && iosURL) {
            window.location.assign(iosURL);
            return;
          }

          if (typeof dialog.showModal === 'function') {
            dialog.showModal();
            dialog.focus({ preventScroll: true });
          } else {
            dialog.setAttribute('open', '');
          }
        });
      });

      closeButton.addEventListener('click', closeSheet);
      dialog.addEventListener('click', event => {
        if (event.target === dialog) closeSheet();
      });
    }

    wireSheet('[data-wordcard-dialog]', '[data-wordcard-open]', '[data-wordcard-close]');
    wireSheet('[data-wechat-dialog]', '[data-wechat-open]', '[data-wechat-close]', wechatArticlesURL);
    </script>
