      <h1>表达多于表现</h1>

      <p>一位擅长摄影的朋友说，有些作品的表现远远多于表达。这句话让我重新想了想，自己为什么拍照。</p>

      <p>我想留下的，往往是一束恰好的光、一个自然的神情，或者某个舍不得错过的瞬间。只有眼前的东西先打动了我，按下快门才有意义。</p>

      <p>好的工具能让我更准确地记录所见，但构图、色彩和技术，都应该服务于想传达的感受。如果只是忙着展示技巧，照片再精致，也可能让人看过就忘。</p>

      <p>所以，拍照之前，我会先问自己：这一刻，究竟有什么值得分享？想清楚这一点，再去选择合适的方式表达。</p>

      <p>Andrew, November 2026</p>
